<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-label="Counting Inversions While Merging"><style>@keyframes a0{0%,6.8%{opacity:0;transform:translateY(10px)}10.8%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s0{animation:a0 7.4s ease-out infinite}@keyframes a1{0%,24.3%{opacity:0;transform:translateY(10px)}28.3%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s1{animation:a1 7.4s ease-out infinite}@keyframes a2{0%,41.9%{opacity:0;transform:translateY(10px)}45.9%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s2{animation:a2 7.4s ease-out infinite}</style><defs><linearGradient id="g11" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#db2777"/></linearGradient></defs><rect width="720" height="336" rx="14" fill="#1e1b2e"/><rect x="14" y="0" width="692" height="4" rx="2" fill="url(#g11)"/><text x="24" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Counting Inversions While Merging</text><text x="24" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">Every time a right element is taken first, it is smaller than all remaining left elements.</text><g class="s0"><text x="24" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">Left (sorted)</text><rect x="190" y="76" width="46" height="36" rx="7" fill="#3b3560"/><text x="213.0" y="99.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text><rect x="242" y="76" width="46" height="36" rx="7" fill="#3b3560"/><text x="265.0" y="99.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text><rect x="294" y="76" width="46" height="36" rx="7" fill="#3b3560"/><text x="317.0" y="99.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">7</text><text x="400" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">if a[i] ≤ a[j] → take left</text></g><g class="s1"><text x="24" y="151" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">Right (sorted)</text><rect x="190" y="126" width="46" height="36" rx="7" fill="#3b3560"/><text x="213.0" y="149.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text><rect x="242" y="126" width="46" height="36" rx="7" fill="#3b3560"/><text x="265.0" y="149.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="400" y="151" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">if a[i] &gt; a[j] → take right,</text><text x="400" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">add (m − i + 1) inversions</text></g><g class="s2"><text x="24" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">Merged</text><rect x="190" y="196" width="46" height="36" rx="7" fill="#f97316"/><text x="213.0" y="219.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text><rect x="242" y="196" width="46" height="36" rx="7" fill="#3b3560"/><text x="265.0" y="219.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text><rect x="294" y="196" width="46" height="36" rx="7" fill="#3b3560"/><text x="317.0" y="219.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text><rect x="346" y="196" width="46" height="36" rx="7" fill="#f97316"/><text x="369.0" y="219.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">6</text><rect x="398" y="196" width="46" height="36" rx="7" fill="#3b3560"/><text x="421.0" y="219.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">7</text><text x="213" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#f97316" text-anchor="middle" font-weight="bold">+3</text><text x="369" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#f97316" text-anchor="middle" font-weight="bold">+1</text><text x="190" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">2 jumps ahead of 3, 5, 7 → +3</text><text x="190" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">6 jumps ahead of 7 → +1</text><text x="458" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#db2777" text-anchor="start" font-weight="bold">Total = 4</text></g><rect x="24" y="312" width="11" height="11" rx="3" fill="#3b3560"/><text x="41" y="322" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9b4d6" text-anchor="start" font-weight="normal">element</text><rect x="107.1" y="312" width="11" height="11" rx="3" fill="#f97316"/><text x="124.1" y="322" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9b4d6" text-anchor="start" font-weight="normal">taken from right</text></svg>