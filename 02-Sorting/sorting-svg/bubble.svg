<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" role="img" aria-label="Bubble Sort"><style>@keyframes a0{0%,6.8%{opacity:0;transform:translateY(10px)}10.8%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s0{animation:a0 7.4s ease-out infinite}@keyframes a1{0%,24.3%{opacity:0;transform:translateY(10px)}28.3%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s1{animation:a1 7.4s ease-out infinite}@keyframes a2{0%,41.9%{opacity:0;transform:translateY(10px)}45.9%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s2{animation:a2 7.4s ease-out infinite}</style><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#db2777"/></linearGradient></defs><rect width="720" height="278" rx="14" fill="#1e1b2e"/><rect x="14" y="0" width="692" height="4" rx="2" fill="url(#g1)"/><text x="24" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Bubble Sort</text><text x="24" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">Compare neighbours and swap if out of order — the largest value bubbles to the end each pass.</text><g class="s0"><text x="24" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">Start</text><rect x="170" y="76" width="52" height="40" rx="7" fill="#db2777"/><text x="196.0" y="101.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text><rect x="228" y="76" width="52" height="40" rx="7" fill="#db2777"/><text x="254.0" y="101.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text><rect x="286" y="76" width="52" height="40" rx="7" fill="#3b3560"/><text x="312.0" y="101.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor=