<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="720" height="334" role="img" aria-label="Insertion Sort"><style>@keyframes a0{0%,5.7%{opacity:0;transform:translateY(10px)}9.7%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s0{animation:a0 8.7s ease-out infinite}@keyframes a1{0%,20.7%{opacity:0;transform:translateY(10px)}24.7%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s1{animation:a1 8.7s ease-out infinite}@keyframes a2{0%,35.6%{opacity:0;transform:translateY(10px)}39.6%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s2{animation:a2 8.7s ease-out infinite}@keyframes a3{0%,50.6%{opacity:0;transform:translateY(10px)}54.6%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}.s3{animation:a3 8.7s ease-out infinite}</style><defs><linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#db2777"/></linearGradient></defs><rect width="720" height="334" rx="14" fill="#1e1b2e"/><rect x="14" y="0" width="692" height="4" rx="2" fill="url(#g3)"/><text x="24" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#fff" text-anchor="start" font-weight="bold">Insertion Sort</text><text x="24" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9b4d6" text-anchor="start" font-weight="normal">Take the next element (key) and insert it into the sorted prefix by shifting larger values right.</text><g class="s0"><text x="24" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">Start</text><rect x="170" y="76" width="52" height="40" rx="7" fill="#16a34a"/><text x="196.0" y="101.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text><rect x="228" y="76" width="52" height="40" rx="7" fill="#f97316"/><text x="254.0" y="101.6" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text><re